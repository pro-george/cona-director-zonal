<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#004987">
<title>CONA OPS</title>
<style>
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#f6f7f8;transition:opacity .6s ease,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
#splash .wm{font:900 34px/1 "neue-haas-grotesk-display","Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.01em;color:#004987;opacity:0;transform:translateY(6px);animation:spIn .9s ease .15s forwards}
#splash .wm span{font-weight:400;letter-spacing:.22em;margin-left:.35em;color:#66717a}
#splash .ln{width:120px;height:2px;border-radius:2px;background:#e7eaed;overflow:hidden;opacity:0;animation:spIn .6s ease .6s forwards}
#splash .ln i{display:block;width:40%;height:100%;background:#004987;border-radius:2px;animation:spRun 1.3s ease-in-out infinite}
#splash .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes spIn{to{opacity:1;transform:none}}
@keyframes spRun{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){#splash,#splash .wm,#splash .ln{animation:none;transition:none;opacity:1;transform:none}#splash .ln i{animation:none}}
</style>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/ksz2bot.css">
</head>
<body>
<div id="splash" role="status"><div class="wm" aria-hidden="true">CONA<span>OPS</span></div><div class="ln" aria-hidden="true"><i></i></div><span class="sr">Se încarcă CONA OPS</span></div>
<div id="root"></div>
<script type="module" src="./src/main.tsx"></script>
</body>
</html>
